name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Android SDK (ja vem instalado no servidor do GitHub)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Colocar o acesso do Google no app
        env:
          GD_SECRET: ${{ secrets.GD_SECRET }}
        run: python3 tools/embutir_google.py

      - name: Compilar
        run: |
          # a chave do APK tem que ser SEMPRE a mesma (senao o celular recusa atualizar por cima)
          keytool -list -v -keystore app/debug.keystore -storepass android | grep -q "5A:2C:42:0C:2A:E5:32:38" || { echo "::error::A chave do APK mudou: o APK nao atualizaria por cima. Compilacao parada."; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Guardar o APK desta compilacao
        uses: actions/upload-artifact@v4
        with:
          name: STOX3-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar o APK na pagina de Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk STOX3-novo.apk
          T="STOX3 versao 4.3 (compilacao ${{ github.run_number }})"
          N="Baixe o arquivo STOX3.apk no celular e instale por cima da versao anterior (os dados ficam)."
          R=${{ github.repository }}
          # o link do APK nunca fica quebrado: sobe o novo com outro nome, apaga o antigo e renomeia (antes a pagina era apagada e recriada)
          if ! gh release view ultima >/dev/null 2>&1; then cp STOX3-novo.apk STOX3.apk; gh release create ultima STOX3.apk --prerelease --title "$T" --notes "$N"; exit 0; fi
          gh release upload ultima STOX3-novo.apk --clobber
          OLD=$(gh api repos/$R/releases/tags/ultima --jq '.assets[]|select(.name=="STOX3.apk")|.id')
          NEW=$(gh api repos/$R/releases/tags/ultima --jq '.assets[]|select(.name=="STOX3-novo.apk")|.id')
          if [ -n "$OLD" ]; then gh api -X DELETE repos/$R/releases/assets/$OLD; fi
          gh api -X PATCH repos/$R/releases/assets/$NEW -f name=STOX3.apk >/dev/null
          gh release edit ultima --title "$T" --notes "$N"
