name: Compilar APK 3.1 (reserva)

on:
  push:
    branches: [reserva-3.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar o Android SDK (ja vem instalado no servidor do GitHub)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Colocar o acesso do Google no app
        env:
          GD_SECRET: ${{ secrets.GD_SECRET }}
        run: python3 tools/embutir_google.py

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Guardar o APK desta compilacao
        uses: actions/upload-artifact@v4
        with:
          name: STOX3-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK na pagina de Releases
        if: github.ref == 'refs/heads/reserva-3.1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk STOX3.apk
          gh release delete v3.1 --yes --cleanup-tag || true
          gh release create v3.1 STOX3.apk --latest=false --title "STOX3 versao 3.1 (para voltar)" --notes "Copia da versao 3.1, guardada para voltar caso a 3.2 nao agrade. Instale este APK por cima do app (os dados ficam)."
